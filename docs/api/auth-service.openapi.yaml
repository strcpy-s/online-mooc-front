components:
  schemas:
    RoleDTO:
      type: object
      description: 角色实体
      properties:
        id:
          type: integer
          format: int64
          description: 主键
          example: 1
        code:
          type: string
          description: 角色代号
          example: admin
        name:
          type: string
          description: 角色名称
          example: 教师
    PrivilegeDTO:
      type: object
      description: API权限
      properties:
        id:
          type: integer
          format: int64
          description: 权限id
          example: 1
        menuId:
          type: integer
          format: int64
          description: 权限所属菜单id
          example: 1
        intro:
          type: string
          description: 权限说明
          example: 新增员工
        method:
          type: string
          description: API请求方式
          example: GET
          pattern: ^GET|POST|PUT|DELETE$
        uri:
          type: string
          description: API请求路径
          example: /account/staff
        internal:
          type: boolean
          description: 是否是内部权限
      required:
        - intro
        - uri
    MenuDTO:
      type: object
      description: 菜单表单实体
      properties:
        id:
          type: integer
          format: int64
          description: 菜单id
          example: 1
        parentId:
          type: integer
          format: int64
          description: 父菜单id
          example: 0
        label:
          type: string
          description: 菜单文本
          example: 系统管理
        path:
          type: string
          description: 菜单路径
          example: /sys/index
        icon:
          type: string
          description: 菜单图标
          example: el-icon-sys
        priority:
          type: integer
          format: int32
          description: 菜单顺序
          example: 1
    LoginFormDTO:
      type: object
      description: 登录表单实体
      properties:
        type:
          type: integer
          format: int32
          description: 登录方式：1-密码登录; 2-验证码登录
          example: 1
        username:
          type: string
          description: 用户名
          example: jack
        cellPhone:
          type: string
          description: 手机号
          example: "13800010001"
        password:
          type: string
          description: 密码
          example: "123"
        rememberMe:
          type: boolean
          description: 7天免密登录
          example: true
      required:
        - password
        - type
    PageQuery:
      type: object
      description: 分页请求参数
      properties:
        pageNo:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 5
