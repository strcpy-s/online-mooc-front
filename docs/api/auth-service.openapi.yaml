openapi: 3.1.0
info:
  title: 智慧MOOC - 权限微服务接口文档
  description: 该服务用于管理权限相关信息
  contact:
    name: 研究院
    url: http://www.itcast.cn/
    email: 1418875140@qq.com
  version: v1.0
servers:
  - url: http://localhost:10010
    description: Generated server url
paths:
  /roles/{id}:
    get:
      tags:
        - 角色管理
      summary: 根据id查询角色
      operationId: queryRoleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/RoleDTO"
    put:
      tags:
        - 角色管理
      summary: 修改角色信息
      operationId: updateRole
      parameters:
        - name: id
          in: path
          description: 角色id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDTO"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
        - 角色管理
      summary: 删除角色信息
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          description: 角色id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: OK
