openapi: 3.1.0
info:
  title: 智慧MOOC - 用户中心接口文档
  description: 该服务用户管理、用户信息管理
  contact:
    name: 研究院
    url: http://www.itcast.cn/
    email: 1418875140@qq.com
  version: v1.0
servers:
  - url: http://192.168.25.1:10082
    description: Generated server url
paths:
  /users/{id}:
    get:
      tags:
        - 用户管理接口
      summary: 根据id查询用户信息
      operationId: queryUserById
      parameters:
        - name: id
          in: path
          description: 用户id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/UserDTO"
    put:
      tags:
        - 用户管理接口
      summary: 更新用户信息
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDTO"
        required: true
      responses:
        "200":
          description: OK
  /users/{id}/status/{status}:
    put:
      tags:
        - 用户管理接口
      summary: 修改用户状态, status=0为禁用，status=1为正常
      operationId: updateUserStatus
      parameters:
        - name: id
          in: path
          description: 要重置的用户的id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: status
          in: path
          description: 状态
          required: true
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: OK
  /users/{id}/password/default:
    put:
      tags:
        - 用户管理接口
      summary: 重置密码
      operationId: resetPassword
      parameters:
        - name: id
          in: path
          description: 要重置的用户的id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: OK
  /users/current/{id}:
    put:
      tags:
        - 用户管理接口
      summary: 更新当前登录用户信息，可修改密码
      operationId: updateCurrentUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserFormDTO"
        required: true
      responses:
        "200":
          description: OK
  /students:
    put:
      tags:
        - 学员管理接口
      summary: 学员更新个人信息
      operationId: updateStudent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdateDTO"
        required: true
      responses:
        "200":
          description: OK
  /students/updatePassword:
    put:
      tags:
        - 学员管理接口
      summary: 学员修改密码
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdatePasswordDTO"
        required: true
      responses:
        "200":
          description: OK
  /students/password:
    put:
      tags:
        - 学员管理接口
      summary: 学员找回密码
      operationId: updateMyPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentFormDTO"
        required: true
      responses:
        "200":
          description: OK
  /users:
    post:
      tags:
        - 用户管理接口
      summary: 新增用户，一般是员工或教师
      operationId: saveUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    type: integer
                    format: int64
  /students/updateBindPhone:
    post:
      tags:
        - 学员管理接口
      summary: 更新绑定手机号
      operationId: updateBindPhone
      parameters:
        - name: cellPhone
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /students/sendSms:
    post:
      tags:
        - 学员管理接口
      summary: 解绑手机号 发送验证码
      operationId: sendVerifyCode
      parameters:
        - name: cellPhone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /students/register:
    post:
      tags:
        - 学员管理接口
      summary: 学员注册
      operationId: registerStudent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentFormDTO"
        required: true
      responses:
        "200":
          description: OK
  /users/page:
    get:
      tags:
        - 用户管理接口
      summary: 分页查询用户简易信息
      operationId: queryUserPage
      parameters:
        - name: pageQuery
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UserSimplePageQuery"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/PageDTOUserPageVO"
  /users/me:
    get:
      tags:
        - 用户管理接口
      summary: 获取当前登录用户信息
      operationId: me
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/UserDetailVO"
  /users/checkPasswd/{password}:
    get:
      tags:
        - 用户管理接口
      summary: 检查用户密码是否正确
      operationId: checkPasswd
      parameters:
        - name: password
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    type: boolean
  /users/checkCellphone:
    get:
      tags:
        - 用户管理接口
      summary: 检查用户手机号是否存在
      operationId: checkCellPhone
      parameters:
        - name: cellphone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    type: boolean
  /teachers/page:
    get:
      tags:
        - 用户管理接口
      summary: 分页查询教师信息
      operationId: queryTeacherPage
      parameters:
        - name: pageQuery
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UserPageQuery"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/PageDTOTeacherPageVO"
  /students/page:
    get:
      tags:
        - 学员管理接口
      summary: 分页查询学生信息
      operationId: queryStudentPage
      parameters:
        - name: pageQuery
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UserPageQuery"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/PageDTOStudentPageVO"
  /staffs/page:
    get:
      tags:
        - 用户管理接口
      summary: 分页查询员工信息
      operationId: queryStaffPage
      parameters:
        - name: pageQuery
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UserPageQuery"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 业务状态码，200-成功，其它-失败
                    example: 200
                  msg:
                    type: string
                    description: 响应消息
                    example: OK
                  requestId:
                    type: string
                    description: 请求id
                    example: 1af123c11412e
                  data:
                    $ref: "#/components/schemas/PageDTOStaffVO"
components:
  schemas:
    UserDTO:
      type: object
      description: 用户详情
      properties:
        id:
          type: integer
          format: int64
          description: 用户id
          example: 1
        cellPhone:
          type: string
          description: 手机
          example: "13890011009"
          pattern: ^1([38][0-9]|4[579]|5[0-3,5-9]|6[6]|7[0135678]|9[89])\d{8}$
        name:
          type: string
          description: 用户名称/昵称
          example: 李四
        type:
          type: integer
          format: int32
          description: 用户类型，1-其他员工,2-普通学员，3-老师
          example: 2
        roleId:
          type: integer
          format: int64
          description: 角色id，老师和学生不用填
          example: 5
        icon:
          type: string
          description: 头像
          example: default-user-icon.jpg
        job:
          type: string
          description: 岗位
          example: 讲师
        intro:
          type: string
          description: 个人介绍
          example: 高级Java讲师
        photo:
          type: string
          description: 形象照地址
          example: default-teacher-photo.jpg
        username:
          type: string
          description: 用户名
          example: "13800010004"
        email:
          type: string
          format: email
          description: 邮箱
        qq:
          type: string
          description: QQ号码
        province:
          type: string
          description: 省
        city:
          type: string
          description: 市
        district:
          type: string
          description: 区
        gender:
          type: integer
          format: int32
          description: 性别：0-男性，1-女性
          example: 0
      required:
        - type
    UserFormDTO:
      type: object
      description: 修改用户信息的表单，带有密码
      properties:
        id:
          type: integer
          format: int64
          description: 用户id
          example: 1
        cellPhone:
          type: string
          description: 手机
          example: "13890011009"
          pattern: ^1([38][0-9]|4[579]|5[0-3,5-9]|6[6]|7[0135678]|9[89])\d{8}$
        name:
          type: string
          description: 用户名称/昵称
          example: 李四
        type:
          type: integer
          format: int32
          description: 用户类型，1-其他员工,2-普通学员，3-老师
          example: 2
        roleId:
          type: integer
          format: int64
          description: 角色id，老师和学生不用填
          example: 5
        icon:
          type: string
          description: 头像
          example: default-user-icon.jpg
        job:
          type: string
          description: 岗位
          example: 讲师
        intro:
          type: string
          description: 个人介绍
          example: 高级Java讲师
        photo:
          type: string
          description: 形象照地址
          example: default-teacher-photo.jpg
        username:
          type: string
          description: 用户名
          example: "13800010004"
        email:
          type: string
          format: email
          description: 邮箱
        qq:
          type: string
          description: QQ号码
        province:
          type: string
          description: 省
        city:
          type: string
          description: 市
        district:
          type: string
          description: 区
        gender:
          type: integer
          format: int32
          description: 性别：0-男性，1-女性
          example: 0
        oldPassword:
          type: string
          description: 原始密码
          example: "123321"
        password:
          type: string
          description: 新密码
          example: "123321"
      required:
        - oldPassword
        - password
        - type
    StudentUpdateDTO:
      type: object
      description: 学员修改个人信息
      properties:
        id:
          type: integer
          format: int64
          description: 用户id
          example: 1
        name:
          type: string
          description: 用户名称/昵称
          example: 李四
        icon:
          type: string
          description: 头像
          example: default-user-icon.jpg
        intro:
          type: string
          description: 个人介绍
          example: 高级Java讲师
        photo:
          type: string
          description: 形象照地址
          example: default-teacher-photo.jpg
        email:
          type: string
          format: email
          description: 邮箱
        qq:
          type: string
          description: QQ号码
        province:
          type: string
          description: 省
        city:
          type: string
          description: 市
        district:
          type: string
          description: 区
        gender:
          type: integer
          format: int32
          description: 性别：0-男性，1-女性
          example: 0
    StudentUpdatePasswordDTO:
      type: object
      description: 学生修改密码的表单实体
      properties:
        id:
          type: integer
          format: int64
          description: 用户id
          example: 1
        oldPassword:
          type: string
          description: 原始密码
          example: "123321"
        newPassword:
          type: string
          description: 新密码
          example: "123321"
      required:
        - id
        - newPassword
        - oldPassword
    StudentFormDTO:
      type: object
      description: 学生注册和修改密码的表单实体
      properties:
        cellPhone:
          type: string
          description: 手机号
          example: "13800010004"
        password:
          type: string
          description: 密码
          example: "123456"
        code:
          type: string
          description: 验证码
          example: "645632"
    UserSimplePageQuery:
      type: object
      description: 用户分页查询条件
      properties:
        pageNo:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 5
          minimum: 1
        isAsc:
          type: boolean
          description: 是否升序
          example: true
        sortBy:
          type: string
          description: 排序字段
          example: id
        gender:
          type: integer
          format: int32
          description: 性别
        name:
          type: string
          description: 用户名称
        type:
          type: string
          description: 用户类型
    PageDTOUserPageVO:
      type: object
      description: 分页结果
      properties:
        total:
          type: integer
          format: int64
          description: 总条数
        pages:
          type: integer
          format: int64
          description: 总页码数
        list:
          type: array
          description: 当前页数据
          items:
            $ref: "#/components/schemas/UserPageVO"
    UserPageVO:
      type: object
      description: 用户信息
      properties:
        id:
          type: integer
          format: int64
          description: 用户id
          example: 1
        name:
          type: string
          description: 用户名称
          example: 张三
        icon:
          type: string
          description: 头像
          example: default-icon.jpg
        cellPhone:
          type: string
          description: 手机号
          example: "13800010004"
        createTime:
          type: string
          format: date-time
          description: 注册时间
          example: 2022-07-12
        status:
          type: integer
          format: int32
          description: 账户状态，0-禁用，1-正常
          example: 1
    UserDetailVO:
      type: object
      description: 用户详情
      properties:
        id:
          type: integer
          format: int64
          description: 用户id
          example: 1
        name:
          type: string
          description: 名字
          example: 张三
        icon:
          type: string
          description: 头像
          example: default-icon.jpg
        cellPhone:
          type: string
          description: 手机号
          example: "13800010004"
        username:
          type: string
          description: 用户名
          example: "13800010004"
        email:
          type: string
          description: 邮箱
        job:
          type: string
          description: 岗位
        qq:
          type: string
          description: QQ号码
        intro:
          type: string
          description: 个人介绍
        photo:
          type: string
          description: 教师形象照
        province:
          type: string
          description: 省
        city:
          type: string
          description: 市
        district:
          type: string
          description: 区
        gender:
          type: integer
          format: int32
          description: 性别：0-男性，1-女性
          example: 0
        createTime:
          type: string
          format: date-time
          description: 注册时间
          example: 2022-07-12
        roleName:
          type: string
          description: 角色名称
          example: 教师
    UserPageQuery:
      type: object
      description: 教师分页查询条件
      properties:
        pageNo:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 5
          minimum: 1
        isAsc:
          type: boolean
          description: 是否升序
          example: true
        sortBy:
          type: string
          description: 排序字段
          example: id
        status:
          type: integer
          format: int32
          description: 账户状态
        name:
          type: string
          description: 教师名称
        phone:
          type: string
          description: 手机号码
    PageDTOTeacherPageVO:
      type: object
      description: 分页结果
      properties:
        total:
          type: integer
          format: int64
          description: 总条数
        pages:
          type: integer
          format: int64
          description: 总页码数
        list:
          type: array
          description: 当前页数据
          items:
            $ref: "#/components/schemas/TeacherPageVO"
    TeacherPageVO:
      type: object
      description: 分页教师信息
      properties:
        id:
          type: integer
          format: int64
          description: 教师id，也是用户id
          example: 1
        name:
          type: string
          description: 教师名称
          example: 罗老师
        icon:
          type: string
          description: 头像
          example: default-user-icon.jpg
        cellPhone:
          type: string
          description: 手机号
          example: "13980019001"
        job:
          type: string
          description: 岗位
          example: 讲师
        intro:
          type: string
          description: 介绍
          example: 高级Java讲师
        courseAmount:
          type: integer
          format: int32
          description: 负责的课程数量
          example: 10
        examQuestionAmount:
          type: integer
          format: int32
          description: 出题数量
          example: 18
        createTime:
          type: string
          format: date-time
          description: 注册时间
          example: 2022-07-12
        status:
          type: integer
          format: int32
          description: 账户状态，0-禁用，1-正常
          example: 1
        photo:
          type: string
          description: 形象照片地址
          example: default-user-icon.jpg
    PageDTOStudentPageVO:
      type: object
      description: 分页结果
      properties:
        total:
          type: integer
          format: int64
          description: 总条数
        pages:
          type: integer
          format: int64
          description: 总页码数
        list:
          type: array
          description: 当前页数据
          items:
            $ref: "#/components/schemas/StudentPageVO"
    StudentPageVO:
      type: object
      description: 学生信息
      properties:
        id:
          type: integer
          format: int64
          description: 学生id，也是用户id
          example: 1
        name:
          type: string
          description: 学生名称
          example: 张三
        icon:
          type: string
          description: 头像
          example: default-icon.jpg
        cellPhone:
          type: string
